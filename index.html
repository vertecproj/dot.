<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>dot.</title>
<meta name="description" content="Controle de ponto e banco de horas: cronômetro ou horários digitados, saldo do mês e avisos.">
<meta name="theme-color" content="#141a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="dot.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css?v=22">
<link rel="stylesheet" href="dot.css?v=22">
</head>
<body>

<div class="auth" id="authShell" hidden>
  <div class="auth-art"><div class="sky"><i class="stars"></i><i class="orb"></i><i class="hill"></i></div>
    <div class="brand"><span class="logo"></span>dot.</div>
    <div><h1>Do nascer ao pôr do sol, suas horas no lugar.</h1><p>Registre suas batidas e saiba, a qualquer hora, se o mês vai fechar no positivo. Seus dados são criptografados: só você vê.</p></div>
  </div>
  <div class="auth-form"><form id="authForm" novalidate></form></div>
</div>

<div class="app" id="appShell" hidden>
  <header class="hdr">
    <div class="sky"><i class="stars"></i><i class="orb"></i><i class="hill"></i></div>
    <div class="hdr-bar">
      <div class="brand"><span class="logo"></span>dot.</div>
      <nav id="sidenav" aria-label="Menu"></nav>
      <div class="sync" id="sync" title=""><i></i><span id="syncTxt">tudo salvo</span><span id="who" hidden></span></div>
    </div>
    <div class="hdr-main">
      <div><div class="sub" id="ttlSub"></div><h1 id="ttl"></h1></div>
      <div class="mnav" id="mnav"><button id="prev" aria-label="Mês anterior">‹</button><span id="mlabel"></span><button id="next" aria-label="Próximo mês">›</button><button id="today" class="today" hidden>Hoje</button></div>
    </div>
  </header>
  <main><div id="view"></div></main>
</div>
<nav class="bottomnav" id="bottomnav" aria-label="Menu" hidden></nav>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=22"></script>
<script src="store.js?v=22"></script>
<script src="controls.js?v=22"></script>
<script src="app.js?v=22"></script>
</body>
</html>
